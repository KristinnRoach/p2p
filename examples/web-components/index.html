<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@kidlib/p2p web components</title>
    <script type="module" src="./p2p-room-components.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: #111827;
        background: #f7f8fa;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(960px, calc(100vw - 2rem));
        margin: 0 auto;
        padding: 2rem 0;
      }

      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.5rem;
        font-weight: 700;
      }

      p {
        margin: 0;
        color: #4b5563;
      }

      p2p-room {
        display: grid;
        gap: 1rem;
        margin-top: 1.25rem;
      }

      .panel {
        padding: 1rem;
        border: 1px solid #d7dce3;
        border-radius: 8px;
        background: white;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>@kidlib/p2p web components</h1>
      <p>Open this page in a few tabs, use the same room ID, and join.</p>

      <p2p-room room-id="demo-room" member-capacity="6">
        <section class="panel">
          <p2p-room-controls></p2p-room-controls>
        </section>

        <section class="panel">
          <p2p-room-status></p2p-room-status>
        </section>

        <p2p-video-grid></p2p-video-grid>

        <section class="panel">
          <p2p-text-chat></p2p-text-chat>
        </section>
      </p2p-room>
    </main>
  </body>
</html>
